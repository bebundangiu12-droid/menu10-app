<!doctype html><html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100e"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menu 10"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png"><title>Menu 10 Chức Năng</title>
<style>
:root{--bg:#070a0a;--card:#101414;--line:#202929;--a:#19e6bd;--m:#82918e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12312c,#070a0a 42%);color:#eef7f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:22px 16px 30px}.hero{display:flex;align-items:center;gap:14px;margin-bottom:18px}.avatar{width:62px;height:62px;border-radius:18px;object-fit:cover;border:1px solid #35534d}.title{font-weight:800;font-size:20px}.sub{color:var(--m);font-size:12px;margin-top:3px}
.panel{background:#0d1212e6;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 14px 40px #0007}.keyrow{display:flex;gap:8px}.keyrow input{flex:1;min-width:0;background:#080b0b;border:1px solid #273432;color:white;border-radius:12px;padding:13px;font-size:15px;outline:0}.keyrow button{border:0;border-radius:12px;background:var(--a);color:#03100d;font-weight:800;padding:0 15px}
.status{margin-top:10px;color:var(--m);font-size:12px}.menu{margin-top:12px;opacity:.38;pointer-events:none}.menu.open{opacity:1;pointer-events:auto}
.item{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;margin:7px 0;background:#101515;border:1px solid #1e2927;border-radius:14px}.name{font-size:14px}
.switch{width:48px;height:28px;background:#303a38;border-radius:20px;padding:3px}.dot{width:22px;height:22px;background:#fff;border-radius:50%;transition:.15s}.switch.on{background:var(--a)}.switch.on .dot{transform:translateX(20px)}
.log{margin-top:12px;background:#080b0b;border:1px solid #1e2927;border-radius:14px;padding:11px;height:110px;overflow:auto;font:12px monospace;color:#8d9a97}.ok{color:#27e8bd}.err{color:#ff6969}.note{font-size:11px;color:#667370;text-align:center;margin-top:12px;line-height:1.45}
</style></head><body><main class="wrap">
<section class="hero"><img class="avatar" src="icon-180.png" alt="Ảnh đại diện"><div><div class="title">⚡ MENU 10 CHỨC NĂNG</div><div class="sub">Scriptable-style control panel</div></div></section>
<section class="panel"><div class="keyrow"><input id="key" type="text" placeholder="Nhập key kích hoạt" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="unlock" type="button">MỞ</button></div>
<div id="status" class="status">🔒 Menu đang khóa</div><div id="menu" class="menu"></div><div id="log" class="log">▶ Nhập key để mở khóa menu.</div>
<div class="note">Các công tắc giữ nguyên logic của file gốc: chỉ thay đổi trạng thái BẬT/TẮT trong giao diện.</div></section></main>
<script>
const KEY="PALOFSC2026";
const names=["🎯 Aimlock","🪶 Nhẹ tâm","🔧 Fix rung tâm","🎯 Fix lạc đạn","➡️ Đạn thẳng","🚀 Aimboots","💀 Aimhead","⚙️ Tối ưu máy","📺 Buff màn 120Hz","🔥 Tăng hiệu năng"];
const menu=document.getElementById("menu"),logBox=document.getElementById("log"),status=document.getElementById("status");let unlocked=false;
function log(msg,good){const e=document.createElement("div");e.textContent="▶ "+msg;e.className=good===true?"ok":good===false?"err":"";logBox.appendChild(e);logBox.scrollTop=logBox.scrollHeight}
function render(){menu.innerHTML="";names.forEach(n=>{const row=document.createElement("div");row.className="item";const label=document.createElement("span");label.className="name";label.textContent=n;const sw=document.createElement("div");sw.className="switch";const dot=document.createElement("div");dot.className="dot";sw.appendChild(dot);sw.addEventListener("click",()=>{if(!unlocked)return;sw.classList.toggle("on");const on=sw.classList.contains("on");log(n+": "+(on?"BẬT":"TẮT"),on)});row.append(label,sw);menu.appendChild(row)})}
function unlock(){const k=document.getElementById("key").value.trim();if(k===KEY){unlocked=true;menu.classList.add("open");status.textContent="🔓 Đã mở khóa";log("✅ Key hợp lệ - Menu đã mở khóa",true)}else log("❌ Key sai",false)}
document.getElementById("unlock").addEventListener("click",unlock);document.getElementById("key").addEventListener("keydown",e=>{if(e.key==="Enter")unlock()});render();
</script></body></html>
